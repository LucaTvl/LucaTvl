name: Update GitHub Ecosystem

on:
  schedule:
    - cron: '0 0 * * *' # Every day at 00:00 UTC
  workflow_dispatch:      # Allows manual one-click updates
  push:
    branches:
      - main
    paths:
      - '.github/workflows/orbit.yml'

permissions:
  contents: write         # Needed to commit generated SVG back to repository

jobs:
  visualize:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Cosmos
        uses: NiconiKimg/github-profile-orbit@v1
        with:
          username: LucaTvl
          token: ${{ secrets.GITHUB_TOKEN }}
          template: space
          theme: auto
          output_path: dist/github-cosmos.svg
          external_repositories: |
            upskill-team/Back-End-DSW
            upskill-team/Front-End-DSW
            SIGMA-LA/Front-End-SIGMA-LA
            SIGMA-LA/Back-End-SIGMA-LA
            Frasquito3/PedemonteDigitalTwin_v2
            NiconiKimg/AnyLogicWebToolkit